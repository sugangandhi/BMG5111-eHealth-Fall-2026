name: Build & Deploy iOS to TestFlight

on:
  # Trigger manually from GitHub Actions ("Run workflow") so rapid git pushes
  # do not exhaust Apple's active signing certificate limit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy_ios_testflight:
    runs-on: macos-latest
    environment: APPSTORE_KEY_ID
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Install CocoaPods & dependencies
        working-directory: flutter_smart_health/src/app
        run: |
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Import reusable .p12 Distribution Certificate (if configured)
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          if [ -n "$IOS_DIST_CERT_BASE64" ] && [ -n "$IOS_DIST_CERT_PASSWORD" ]; then
            echo "Importing reusable iOS Distribution certificate into temporary Keychain..."
            KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
            KEYCHAIN_PASS="temp-ci-keychain-pass"
            CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
            echo -n "$IOS_DIST_CERT_BASE64" | base64 --decode -o "$CERT_PATH"
            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH"
            echo "Reusable .p12 certificate imported successfully."
          else
            echo "No IOS_DIST_CERT_BASE64 secret configured; using App Store Connect Cloud Signing."
          fi

      - name: Setup App Store Connect API Key
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID || secrets.KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || secrets.ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY || secrets.PRIVATE_KEY }}
        run: |
          if [ -z "$APPSTORE_KEY_ID" ] || [ -z "$APPSTORE_PRIVATE_KEY" ]; then
            echo "::error ::App Store Connect API Key secrets are missing. Please configure APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, and APPSTORE_PRIVATE_KEY in GitHub Secrets."
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys ~/private_keys
          echo "$APPSTORE_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          echo "$APPSTORE_PRIVATE_KEY" > ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8 ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

      - name: Auto-clean excess CI signing certificates in App Store Connect
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID || secrets.KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || secrets.ISSUER_ID }}
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
        run: |
          if [ -n "$IOS_DIST_CERT_BASE64" ]; then
            echo "Using reusable .p12 certificate; skipping certificate cleanup."
            exit 0
          fi
          python3 -m venv /tmp/asc_venv
          /tmp/asc_venv/bin/pip install --quiet pyjwt cryptography requests
          /tmp/asc_venv/bin/python - << 'PY'
          import os, time, jwt, requests

          key_id = os.environ["APPSTORE_KEY_ID"].strip()
          issuer_id = os.environ["APPSTORE_ISSUER_ID"].strip()
          key_path = os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{key_id}.p8")
          with open(key_path, "r", encoding="utf-8") as f:
              private_key = f.read()

          now = int(time.time())
          token = jwt.encode(
              {"iss": issuer_id, "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
              private_key,
              algorithm="ES256",
              headers={"kid": key_id, "typ": "JWT"},
          )
          headers = {"Authorization": f"Bearer {token}"}
          resp = requests.get(
              "https://api.appstoreconnect.apple.com/v1/certificates?limit=100",
              headers=headers,
              timeout=20,
          )
          if resp.status_code != 200:
              print(f"Could not list certificates ({resp.status_code}): {resp.text[:200]}")
              raise SystemExit(0)

          certs = resp.json().get("data", [])
          print(f"Found {len(certs)} active certificates on Apple Developer account.")
          # Revoke excess DEVELOPMENT / IOS_DEVELOPMENT / DISTRIBUTION / IOS_DISTRIBUTION certs
          # created by ephemeral CI runners so xcodebuild always has a free slot.
          for ctype, max_keep in [
              ("DEVELOPMENT", 0),
              ("IOS_DEVELOPMENT", 0),
              ("DISTRIBUTION", 0),
              ("IOS_DISTRIBUTION", 0),
          ]:
              matching = [c for c in certs if c.get("attributes", {}).get("certificateType") == ctype]
              if len(matching) > max_keep:
                  # Sort oldest first so we revoke oldest excess certs
                  matching.sort(key=lambda c: c.get("attributes", {}).get("expirationDate", ""))
                  to_delete = matching[: len(matching) - max_keep]
                  for c in to_delete:
                      cid = c["id"]
                      cname = c.get("attributes", {}).get("displayName", cid)
                      dr = requests.delete(
                          f"https://api.appstoreconnect.apple.com/v1/certificates/{cid}",
                          headers=headers,
                          timeout=20,
                      )
                      print(f"Revoked {ctype} cert {cid} ({cname}) -> HTTP {dr.status_code}")
          PY

      - name: Build Flutter iOS artifacts
        working-directory: flutter_smart_health/src/app
        run: |
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 10))
          VERSION_NAME="1.0.${BUILD_NUMBER}"
          echo "Building Flutter iOS Release ${VERSION_NAME} (Build ${BUILD_NUMBER})..."
          flutter build ios --release --no-codesign --build-name="${VERSION_NAME}" --build-number="${BUILD_NUMBER}"

      - name: Archive with xcodebuild and App Store Connect API Key
        working-directory: flutter_smart_health/src/app
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID || secrets.KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || secrets.ISSUER_ID }}
        run: |
          mkdir -p build/ios
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ios/Runner.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"

      - name: Export signed .ipa
        working-directory: flutter_smart_health/src/app
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID || secrets.KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || secrets.ISSUER_ID }}
        run: |
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"

      - name: Upload .ipa to Apple TestFlight
        working-directory: flutter_smart_health/src/app
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID || secrets.KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || secrets.ISSUER_ID }}
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error ::No .ipa file generated in build/ios/ipa"
            exit 1
          fi
          echo "Found IPA: $IPA_PATH. Uploading to Apple TestFlight..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
          echo "Build successfully uploaded to Apple TestFlight!"
