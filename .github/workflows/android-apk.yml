name: Build & Publish Android APK

on:
  push:
    branches:
      - flutter-whatsapp-ai-integration
    paths:
      - 'flutter_smart_health/src/app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_android_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Cache deterministic CI signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.ehospital-ci-signing
          key: ci-android-release-env-keystore-v1

      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.jks"
            echo "ANDROID_KEYSTORE_PATH=${{ runner.temp }}/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${SECRET_KS_PASS}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${SECRET_KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${SECRET_KEY_PASS}" >> "$GITHUB_ENV"
          else
            mkdir -p "$HOME/.ehospital-ci-signing"
            KS_PATH="$HOME/.ehospital-ci-signing/release-ci.jks"
            if [ ! -f "$KS_PATH" ]; then
              keytool -genkey -v \
                -keystore "$KS_PATH" \
                -storepass android \
                -alias ehospitalci \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=eHospital CI,O=eHospital,C=US"
            fi
            echo "ANDROID_KEYSTORE_PATH=${KS_PATH}" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=ehospitalci" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Get Flutter dependencies & run tests
        working-directory: flutter_smart_health/src/app
        run: |
          flutter pub get
          flutter test test/api_config_test.dart test/wearable_sync_service_test.dart test/mobile_health_registry_test.dart test/app_update_service_test.dart

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          fi

      - name: Build versioned release APK
        working-directory: flutter_smart_health/src/app
        run: |
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 10))
          VERSION_NAME="1.0.${BUILD_NUMBER}"
          flutter build apk --release --build-number="${BUILD_NUMBER}" --build-name="${VERSION_NAME}"
          mkdir -p "${{ runner.temp }}/release-assets"
          cp build/app/outputs/flutter-apk/app-release.apk "${{ runner.temp }}/release-assets/app-release.apk"
          BUILD_NUMBER="${BUILD_NUMBER}" VERSION_NAME="${VERSION_NAME}" python3 - <<'PY'
          import datetime
          import json
          import os

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"][:7]
          payload = {
              "version_code": int(os.environ["BUILD_NUMBER"]),
              "version_name": os.environ["VERSION_NAME"],
              "apk_url": f"https://github.com/{repo}/releases/download/android-latest/app-release.apk",
              "release_notes": f"Automated build from commit {sha}",
              "published_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          out_path = os.path.join(os.environ["RUNNER_TEMP"], "release-assets", "apk-version.json")
          with open(out_path, "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
          PY

      - name: Publish APK to GitHub Release (android-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          target_commitish: ${{ github.sha }}
          name: eHospital Android Latest
          make_latest: true
          prerelease: false
          body: "Automated Android APK release for eHospital Smart Health."
          files: |
            ${{ runner.temp }}/release-assets/app-release.apk
            ${{ runner.temp }}/release-assets/apk-version.json
