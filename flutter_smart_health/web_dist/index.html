<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="eHospital Intelligent Digital Healthcare & Telemetry Portal">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="eHospital">
  <meta name="theme-color" content="#1345B5">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>eHospital - Intelligent Digital Solution</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    window.clinicalVoice = {
      recognition: null,
      isListening: false,
      mediaRecorder: null,
      activeStream: null,
      audioChunks: [],
      usingAudioRecorder: false,
      _sessionId: 0,
      _pendingStatusCb: null,
      _pendingAudioCb: null,

      _releaseStream: function(streamToStop) {
        var target = streamToStop || this.activeStream;
        if (target) {
          try {
            var tracks = target.getTracks();
            for (var i = 0; i < tracks.length; i++) {
              tracks[i].stop();
            }
          } catch (e) {}
        }
        if (!streamToStop || target === this.activeStream) {
          this.activeStream = null;
        }
      },

      _mergeNonOverlappingSegment: function(accumulated, segment) {
        var prev = (accumulated || '').trim();
        var next = (segment || '').trim();
        if (!next) return prev;
        if (!prev) return next;
        var prevLower = prev.toLowerCase();
        var nextLower = next.toLowerCase();
        if (nextLower.indexOf(prevLower) === 0) return next;
        if (prevLower === nextLower || prevLower.slice(-nextLower.length) === nextLower) {
          return prev;
        }
        return prev + ' ' + next;
      },

      _startWhisperAudioRecorder: function(sessionId, onStatusCallback, onAudioCallback) {
        var self = this;
        self._pendingStatusCb = onStatusCallback;
        self._pendingAudioCb = onAudioCallback;

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
          return false;
        }

        navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        })
          .then(function(stream) {
            if (sessionId !== self._sessionId || !self.isListening) {
              self._releaseStream(stream);
              return;
            }
            self._releaseStream();
            self.activeStream = stream;
            self.audioChunks = [];
            self.usingAudioRecorder = true;

            var options = {};
            var mimeCandidates = [
              'audio/webm;codecs=opus',
              'audio/webm',
              'audio/mp4',
              'audio/ogg;codecs=opus',
              'audio/ogg'
            ];
            if (typeof MediaRecorder.isTypeSupported === 'function') {
              for (var i = 0; i < mimeCandidates.length; i++) {
                if (MediaRecorder.isTypeSupported(mimeCandidates[i])) {
                  options.mimeType = mimeCandidates[i];
                  break;
                }
              }
            }

            var recorder = options.mimeType
              ? new MediaRecorder(stream, options)
              : new MediaRecorder(stream);
            self.mediaRecorder = recorder;

            recorder.ondataavailable = function(e) {
              if (e.data && e.data.size > 0) {
                self.audioChunks.push(e.data);
              }
            };
            recorder.onerror = function(e) {
              if (sessionId !== self._sessionId) return;
              self.isListening = false;
              self.usingAudioRecorder = false;
              self.mediaRecorder = null;
              self._releaseStream();
              if (onStatusCallback) {
                onStatusCallback('error', (e && e.error && e.error.message) || 'Audio recording error.');
              }
            };
            recorder.start(250);
            if (onStatusCallback) onStatusCallback('recording', '');
          })
          .catch(function(err) {
            if (sessionId !== self._sessionId) return;
            console.error('[ClinicalVoice] Whisper MediaRecorder error:', err);
            self.isListening = false;
            self.usingAudioRecorder = false;
            self.mediaRecorder = null;
            self._releaseStream();
            if (onStatusCallback) {
              onStatusCallback('error', (err && err.message) ? err.message : err.toString());
            }
          });
        return true;
      },

      _startWebSpeechFallback: function(sessionId, onResultCallback, onStatusCallback) {
        var self = this;
        var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          self.isListening = false;
          if (onStatusCallback) {
            onStatusCallback('unsupported', 'Live microphone voice capture requires HTTPS or a browser with microphone support.');
          }
          return;
        }

        try {
          if (this.recognition) {
            try { this.recognition.abort(); } catch (e) {}
          }
          var rec = new SpeechRecognition();
          var committedTranscript = '';
          rec.continuous = false;
          rec.interimResults = false;
          rec.lang = 'en-US';

          rec.onstart = function() {
            if (sessionId !== self._sessionId) return;
            self.isListening = true;
            if (onStatusCallback) onStatusCallback('listening', '');
          };

          rec.onresult = function(event) {
            if (sessionId !== self._sessionId) return;
            var latest = '';
            for (var i = event.resultIndex || 0; i < event.results.length; ++i) {
              if (event.results[i].isFinal) {
                latest = self._mergeNonOverlappingSegment(latest, event.results[i][0].transcript);
              }
            }
            if (latest) {
              committedTranscript = self._mergeNonOverlappingSegment(committedTranscript, latest);
              if (onResultCallback) {
                onResultCallback(committedTranscript, '');
              }
            }
          };

          rec.onerror = function(event) {
            if (sessionId !== self._sessionId) return;
            var code = event && event.error ? event.error : 'Speech recognition error';
            if (code === 'aborted') return;
            self.isListening = false;
            if (onStatusCallback) onStatusCallback('error', code);
          };

          rec.onend = function() {
            if (sessionId !== self._sessionId) return;
            self.isListening = false;
            if (onStatusCallback) onStatusCallback('stopped', '');
          };

          this.recognition = rec;
          rec.start();
        } catch (err) {
          self.isListening = false;
          if (onStatusCallback) onStatusCallback('error', err.toString());
        }
      },

      startListening: function(onResultCallback, onStatusCallback, onAudioCallback) {
        var self = this;
        self._sessionId += 1;
        var sessionId = self._sessionId;
        self.isListening = true;
        self.usingAudioRecorder = false;
        self._pendingStatusCb = onStatusCallback || null;
        self._pendingAudioCb = onAudioCallback || null;

        if (self.recognition) {
          try { self.recognition.abort(); } catch (e) {}
          self.recognition = null;
        }

        // Prefer MediaRecorder -> OpenAI whisper-1 so dictation never repeats words
        // (avoids Chromium Android SpeechRecognition duplicate-segment bug).
        if (onAudioCallback && self._startWhisperAudioRecorder(sessionId, onStatusCallback, onAudioCallback)) {
          return;
        }

        self._startWebSpeechFallback(sessionId, onResultCallback, onStatusCallback);
      },

      stopListening: function() {
        var self = this;
        var activeSessionId = self._sessionId;
        self.isListening = false;

        if (this.usingAudioRecorder && this.mediaRecorder) {
          var statusCb = this._pendingStatusCb;
          var audioCb = this._pendingAudioCb;
          var recorder = this.mediaRecorder;
          var chunks = this.audioChunks;
          var mimeType = (recorder.mimeType || 'audio/webm');
          this.usingAudioRecorder = false;
          this.mediaRecorder = null;

          recorder.onstop = function() {
            self._releaseStream();
            if (activeSessionId !== self._sessionId) return;
            var audioBlob = new Blob(chunks, { type: mimeType });
            if (!audioBlob || audioBlob.size < 400 || !audioCb) {
              if (statusCb) statusCb('stopped', '');
              return;
            }
            var ext = mimeType.indexOf('mp4') !== -1
              ? 'recording.mp4'
              : (mimeType.indexOf('ogg') !== -1 ? 'recording.ogg' : 'recording.webm');
            if (statusCb) statusCb('transcribing', '');
            var reader = new FileReader();
            reader.onloadend = function() {
              if (activeSessionId !== self._sessionId) return;
              var base64Data = (reader.result || '').toString().split(',')[1] || '';
              if (base64Data) {
                audioCb(base64Data, ext);
              } else if (statusCb) {
                statusCb('error', 'Empty voice recording captured.');
              }
            };
            reader.readAsDataURL(audioBlob);
          };
          try {
            if (recorder.state !== 'inactive') {
              recorder.stop();
            } else {
              self._releaseStream();
              if (statusCb) statusCb('stopped', '');
            }
          } catch (e) {
            self._releaseStream();
            if (statusCb) statusCb('error', e.toString());
          }
          return;
        }

        // If getUserMedia hasn't resolved yet, bump sessionId/isListening so it releases on resolve.
        if (this._pendingAudioCb && !this.recognition) {
          this._releaseStream();
          if (this._pendingStatusCb) this._pendingStatusCb('stopped', '');
          return;
        }

        if (this.recognition) {
          try {
            this.recognition.stop();
          } catch (e) {}
        }
      },

      startRecordingAudio: function(onStatusCallback) {
        var self = this;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          if (onStatusCallback) onStatusCallback('unsupported', 'Microphone not supported in this browser.');
          return;
        }
        navigator.mediaDevices.getUserMedia({ audio: true })
          .then(function(stream) {
            self._releaseStream();
            self.activeStream = stream;
            self.audioChunks = [];
            self.mediaRecorder = new MediaRecorder(stream);
            self.mediaRecorder.ondataavailable = function(e) {
              if (e.data && e.data.size > 0) {
                self.audioChunks.push(e.data);
              }
            };
            self.mediaRecorder.start();
            if (onStatusCallback) onStatusCallback('recording', '');
          })
          .catch(function(err) {
            console.error('[ClinicalVoice] MediaRecorder error:', err);
            self._releaseStream();
            if (onStatusCallback) onStatusCallback('error', err.toString());
          });
      },

      stopRecordingAudio: function(onDoneCallback) {
        var self = this;
        if (!this.mediaRecorder) {
          this._releaseStream();
          if (onDoneCallback) onDoneCallback('');
          return;
        }
        var recorder = this.mediaRecorder;
        var chunks = this.audioChunks;
        this.mediaRecorder = null;
        recorder.onstop = function() {
          self._releaseStream();
          var audioBlob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
          var reader = new FileReader();
          reader.readAsDataURL(audioBlob);
          reader.onloadend = function() {
            var base64Data = (reader.result || '').toString().split(',')[1] || '';
            if (onDoneCallback) onDoneCallback(base64Data);
          };
        };
        try {
          recorder.stop();
        } catch (e) {
          self._releaseStream();
          if (onDoneCallback) onDoneCallback('');
        }
      }
    };
  </script>
  <script>
    (function () {
      var currentBuildId = null;
      var reloadingForUpdate = false;
      var lastUpdateCheckAt = 0;

      function clearOldServiceWorkersAndCaches() {
        var tasks = [];
        if ('serviceWorker' in navigator) {
          tasks.push(
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              return Promise.all(registrations.map(function (reg) {
                return reg.unregister();
              }));
            }).catch(function () {})
          );
        }
        if ('caches' in window) {
          tasks.push(
            caches.keys().then(function (names) {
              return Promise.all(names.map(function (name) {
                return caches.delete(name);
              }));
            }).catch(function () {})
          );
        }
        var timeout = new Promise(function (resolve) { setTimeout(resolve, 1200); });
        return Promise.race([Promise.all(tasks), timeout]);
      }

      function fetchRemoteBuildId() {
        return fetch('web-version?t=' + Date.now(), {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache' }
        })
          .then(function (res) {
            return res.ok ? res.json() : null;
          })
          .then(function (data) {
            return data && data.build_id ? String(data.build_id) : null;
          })
          .catch(function () {
            return null;
          });
      }

      function loadFlutterBootstrap(tag) {
        window.__ehospitalBuildTag = tag;
        var script = document.createElement('script');
        script.src = 'flutter_bootstrap.js?v=' + encodeURIComponent(tag) + '&t=' + Date.now();
        script.async = true;
        document.body.appendChild(script);
      }

      function checkForAppUpdate() {
        var now = Date.now();
        if (reloadingForUpdate || !currentBuildId || (now - lastUpdateCheckAt) < 5000) {
          return;
        }
        lastUpdateCheckAt = now;
        fetchRemoteBuildId().then(function (latestId) {
          if (!latestId || latestId === currentBuildId || reloadingForUpdate) {
            return;
          }
          reloadingForUpdate = true;
          clearOldServiceWorkersAndCaches().then(function () {
            window.location.reload();
          });
        });
      }

      clearOldServiceWorkersAndCaches()
        .then(fetchRemoteBuildId)
        .then(function (buildId) {
          currentBuildId = buildId;
          lastUpdateCheckAt = Date.now();
          loadFlutterBootstrap(buildId || String(Date.now()));
        });

      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          checkForAppUpdate();
        }
      });

      window.addEventListener('pageshow', function (event) {
        if (event.persisted) {
          checkForAppUpdate();
        }
      });
    })();
  </script>
</body>
</html>
