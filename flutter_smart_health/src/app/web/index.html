<!DOCTYPE html>
<html>
<head>
  <!--

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="eHospital Intelligent Digital Healthcare & Telemetry Portal">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="eHospital">
  <meta name="theme-color" content="#1345B5">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>eHospital - Intelligent Digital Solution</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    window.clinicalVoice = {
      recognition: null,
      isListening: false,
      mediaRecorder: null,
      audioChunks: [],
      
      startListening: function(onResultCallback, onStatusCallback) {
        var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          if (onStatusCallback) onStatusCallback('unsupported', 'Web Speech API is not supported in this browser. Please use Google Chrome or Edge.');
          return;
        }
        
        try {
          if (this.recognition) {
            try { this.recognition.abort(); } catch (e) {}
          }
          var rec = new SpeechRecognition();
          rec.continuous = true;
          rec.interimResults = true;
          rec.lang = 'en-US';
          
          rec.onstart = function() {
            window.clinicalVoice.isListening = true;
            if (onStatusCallback) onStatusCallback('listening', '');
          };
          
          rec.onresult = function(event) {
            var interim = '';
            var final = '';
            for (var i = 0; i < event.results.length; ++i) {
              if (event.results[i].isFinal) {
                final += event.results[i][0].transcript + ' ';
              } else {
                interim += event.results[i][0].transcript;
              }
            }
            if (onResultCallback) {
              onResultCallback(final.trim(), interim.trim());
            }
          };
          
          rec.onerror = function(event) {
            console.warn('[ClinicalVoice] Speech error:', event.error);
            if (onStatusCallback) onStatusCallback('error', event.error || 'Speech recognition error');
          };
          
          rec.onend = function() {
            window.clinicalVoice.isListening = false;
            if (onStatusCallback) onStatusCallback('stopped', '');
          };
          
          this.recognition = rec;
          rec.start();
        } catch (err) {
          console.error('[ClinicalVoice] Failed to start:', err);
          if (onStatusCallback) onStatusCallback('error', err.toString());
        }
      },
      
      stopListening: function() {
        if (this.recognition) {
          try {
            this.recognition.stop();
          } catch (e) {}
          this.isListening = false;
        }
      },

      startRecordingAudio: function(onStatusCallback) {
        var self = this;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          if (onStatusCallback) onStatusCallback('unsupported', 'Microphone not supported in this browser.');
          return;
        }
        navigator.mediaDevices.getUserMedia({ audio: true })
          .then(function(stream) {
            self.audioChunks = [];
            self.mediaRecorder = new MediaRecorder(stream);
            self.mediaRecorder.ondataavailable = function(e) {
              if (e.data && e.data.size > 0) {
                self.audioChunks.push(e.data);
              }
            };
            self.mediaRecorder.start();
            if (onStatusCallback) onStatusCallback('recording', '');
          })
          .catch(function(err) {
            console.error('[ClinicalVoice] MediaRecorder error:', err);
            if (onStatusCallback) onStatusCallback('error', err.toString());
          });
      },

      stopRecordingAudio: function(onDoneCallback) {
        var self = this;
        if (!this.mediaRecorder) {
          if (onDoneCallback) onDoneCallback('');
          return;
        }
        this.mediaRecorder.onstop = function() {
          var audioBlob = new Blob(self.audioChunks, { type: 'audio/webm' });
          var reader = new FileReader();
          reader.readAsDataURL(audioBlob);
          reader.onloadend = function() {
            var base64Data = (reader.result || '').toString().split(',')[1] || '';
            if (onDoneCallback) onDoneCallback(base64Data);
          };
        };
        try {
          this.mediaRecorder.stop();
        } catch (e) {
          if (onDoneCallback) onDoneCallback('');
        }
      }
    };
  </script>
  <script>
    (function () {
      var currentBuildId = null;
      var reloadingForUpdate = false;
      var lastUpdateCheckAt = 0;

      function clearOldServiceWorkersAndCaches() {
        var tasks = [];
        if ('serviceWorker' in navigator) {
          tasks.push(
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              return Promise.all(registrations.map(function (reg) {
                return reg.unregister();
              }));
            }).catch(function () {})
          );
        }
        if ('caches' in window) {
          tasks.push(
            caches.keys().then(function (names) {
              return Promise.all(names.map(function (name) {
                return caches.delete(name);
              }));
            }).catch(function () {})
          );
        }
        var timeout = new Promise(function (resolve) { setTimeout(resolve, 1200); });
        return Promise.race([Promise.all(tasks), timeout]);
      }

      function fetchRemoteBuildId() {
        return fetch('web-version?t=' + Date.now(), {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache' }
        })
          .then(function (res) {
            return res.ok ? res.json() : null;
          })
          .then(function (data) {
            return data && data.build_id ? String(data.build_id) : null;
          })
          .catch(function () {
            return null;
          });
      }

      function loadFlutterBootstrap(tag) {
        window.__ehospitalBuildTag = tag;
        var script = document.createElement('script');
        script.src = 'flutter_bootstrap.js?v=' + encodeURIComponent(tag) + '&t=' + Date.now();
        script.async = true;
        document.body.appendChild(script);
      }

      function checkForAppUpdate() {
        var now = Date.now();
        if (reloadingForUpdate || !currentBuildId || (now - lastUpdateCheckAt) < 5000) {
          return;
        }
        lastUpdateCheckAt = now;
        fetchRemoteBuildId().then(function (latestId) {
          if (!latestId || latestId === currentBuildId || reloadingForUpdate) {
            return;
          }
          reloadingForUpdate = true;
          clearOldServiceWorkersAndCaches().then(function () {
            window.location.reload();
          });
        });
      }

      clearOldServiceWorkersAndCaches()
        .then(fetchRemoteBuildId)
        .then(function (buildId) {
          currentBuildId = buildId;
          lastUpdateCheckAt = Date.now();
          loadFlutterBootstrap(buildId || String(Date.now()));
        });

      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          checkForAppUpdate();
        }
      });

      window.addEventListener('pageshow', function (event) {
        if (event.persisted) {
          checkForAppUpdate();
        }
      });
    })();
  </script>
</body>
</html>
